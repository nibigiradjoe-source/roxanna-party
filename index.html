<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0C09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Roxanna Rania's Party Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600&family=Cinzel:wght@500;600;700&family=Jost:wght@400;500;600&family=Pinyon+Script&family=Limelight&family=Josefin+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;1,500&family=Shrikhand&family=Karla:wght@500;700&family=Bebas+Neue&family=Libre+Baskerville:ital@0;1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;900&family=Parisienne&family=Lora:ital@0;1&family=Abril+Fatface&family=Oswald:wght@500;600&family=Archivo+Black&family=Archivo:wght@500;700&family=Special+Elite&family=Old+Standard+TT:wght@400;700&family=Homemade+Apple&family=EB+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Layout: phone-first party room. Splash, then a sticky top bar over one stage that follows the host's chosen game. Night-club look: champagne gold on black with drifting gold dust. */
:root {
  --bg: #0E0C09; --surface: #18150F; --raised: #231E16; --line: #3E3424;
  --gold: #D9B45A; --gold-hi: #F3DC94; --gold-lo: #A47A2A; --cream: #F4ECDD; --muted: #BDB197; --on-gold: #1A1408;
  --ok: #7FD1A5; --warn: #F0B866; --bad: #F09A8C;
  --f-display: 'Bodoni Moda', Didot, 'Times New Roman', serif;
  --f-label: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --f-body: 'Jost', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --f-script: 'Pinyon Script', 'Snell Roundhand', cursive;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--cream); font-family: var(--f-body); font-size: 17px; line-height: 1.5; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
input, textarea { font-size: 16px; }
:focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 3px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Ambient layers */
#dust { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.lights { position: fixed; inset: -20%; pointer-events: none; z-index: 0; background:
  radial-gradient(circle at 20% 30%, rgba(217,180,90,0.13), transparent 28%),
  radial-gradient(circle at 80% 60%, rgba(232,121,139,0.08), transparent 26%),
  radial-gradient(circle at 50% 90%, rgba(127,174,230,0.07), transparent 30%);
  animation: drift 22s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translate(-3%, -2%) rotate(0deg); } to { transform: translate(3%, 3%) rotate(8deg); } }
.top, main, #fx, .toast { position: relative; z-index: 2; }

/* Splash */
#splash { position: fixed; inset: 0; z-index: 50; background: radial-gradient(ellipse at 50% 40%, #231C10 0%, #0E0C09 65%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; transition: opacity 0.7s ease, transform 0.7s ease; }
#splash.out { opacity: 0; transform: scale(1.06); pointer-events: none; }
.sp-inner { position: relative; width: 190px; height: 190px; }
.sp-ring { position: absolute; inset: 0; width: 190px; height: 190px; }
.sp-c1 { fill: none; stroke: #D9B45A; stroke-width: 2; stroke-dasharray: 580; stroke-dashoffset: 580; animation: draw 1.4s ease-out 0.1s forwards; }
.sp-c2 { fill: none; stroke: #A47A2A; stroke-width: 1; stroke-dasharray: 505; stroke-dashoffset: 505; animation: draw 1.4s ease-out 0.35s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.sp-dots { transform-origin: 100px 100px; animation: spin 7s linear infinite; }
.sp-dots circle { fill: #F3DC94; animation: twinkle 1.6s ease-in-out infinite; }
.sp-dots circle:nth-child(odd) { animation-delay: 0.8s; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
.sp-mono { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 500; font-size: 78px; letter-spacing: -0.04em; line-height: 1;
  background: linear-gradient(110deg, #A47A2A 0%, #D9B45A 30%, #FFF6D6 45%, #D9B45A 60%, #A47A2A 100%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  opacity: 0; transform: scale(0.85); animation: monoIn 0.9s cubic-bezier(.2,.9,.3,1.2) 0.4s forwards, shimmer 2.4s linear 1s infinite; }
@keyframes monoIn { to { opacity: 1; transform: none; } }
@keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
.sp-name { font-family: var(--f-script); font-size: 54px; line-height: 1.2; color: #F3DC94; opacity: 0; transform: translateY(10px); animation: up 0.8s ease-out 0.9s forwards; text-shadow: 0 0 24px rgba(217,180,90,0.35); }
.sp-sub { font-family: var(--f-label); font-weight: 600; letter-spacing: 0.4em; font-size: 12px; color: #D9B45A; opacity: 0; animation: up 0.8s ease-out 1.2s forwards; padding-left: 0.4em; }
@keyframes up { to { opacity: 1; transform: none; } }
.sp-bar { width: 160px; height: 2px; background: #3E3424; border-radius: 2px; overflow: hidden; margin-top: 10px; }
.sp-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #A47A2A, #F3DC94); animation: fill 2.4s ease-in-out forwards; }
@keyframes fill { to { width: 100%; } }

.wrap { max-width: 1040px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(14,12,9,0.86); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topin { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 8px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-label); font-weight: 700; letter-spacing: 0.16em; font-size: 0.78rem; color: var(--gold-hi); }
.brand b { font-family: var(--f-display); font-size: 1.3rem; letter-spacing: -0.02em; font-weight: 500; }
.tright { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chipc { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(127,209,165,0.6); animation: ping 2s infinite; }
.dot.warn { background: var(--warn); animation: none; } .dot.off { background: #6C6252; animation: none; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(127,209,165,0.55); } 70% { box-shadow: 0 0 0 8px rgba(127,209,165,0); } 100% { box-shadow: 0 0 0 0 rgba(127,209,165,0); } }
.strip { display: flex; gap: 8px; overflow-x: auto; padding-block: 0 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch; align-items: center; }
.strip::-webkit-scrollbar { display: none; }
.stlabel { flex-shrink: 0; font-family: var(--f-label); font-weight: 600; letter-spacing: 0.18em; font-size: 0.66rem; color: var(--gold); text-transform: uppercase; padding-right: 2px; }
.pc { display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px 3px 3px; font-size: 0.85rem; transition: border-color 0.3s, opacity 0.3s; }
.pc.me { border-color: var(--gold-lo); }
.pc.off { opacity: 0.5; }
.pc.now { border-color: var(--gold-hi); animation: pulse 1.4s ease-in-out infinite; }
.av { width: 28px; height: 28px; border-radius: 50%; background: var(--av); color: #14110B; display: grid; place-items: center; font-weight: 700; font-size: 0.72rem; position: relative; flex-shrink: 0; }
.av .od { position: absolute; right: -2px; bottom: -2px; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); border: 2px solid var(--bg); }
.av .od.off { background: #6C6252; }
.pcn { white-space: nowrap; font-weight: 500; }
.pcb { font-size: 0.74rem; color: var(--gold-hi); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tmeta { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; opacity: 0.85; text-transform: uppercase; }
.roomname { font-family: var(--f-script); font-size: 2.2rem; line-height: 1.2; color: var(--gold-hi); margin: 0; overflow-wrap: anywhere; }
.choice { display: flex; flex-direction: column; gap: 10px; }
.tab { background: none; border: 1px solid transparent; border-radius: 999px; padding: 6px 14px; min-height: 40px; cursor: pointer; font-weight: 500; font-size: 0.92rem; color: var(--muted); }
.tab[aria-current="page"] { color: var(--gold-hi); border-color: var(--line); background: var(--surface); }

main { padding-block: 20px 96px; }
.stage { display: flex; flex-direction: column; gap: 20px; }
.enter { animation: enter 0.45s cubic-bezier(.2,.8,.2,1); }
@keyframes enter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.banner { background: #3A2A12; border: 1px solid #7A5A22; color: var(--gold-hi); border-radius: 14px; padding: 10px 16px; text-align: center; font-size: 0.95rem; }

/* Type */
.eyebrow, .label { font-family: var(--f-label); font-weight: 600; letter-spacing: 0.26em; text-transform: uppercase; font-size: 0.76rem; color: var(--gold); margin: 0; }
.h1 { font-family: var(--f-display); font-weight: 500; font-size: clamp(1.9rem, 5vw, 2.8rem); line-height: 1.05; margin: 4px 0 0; text-wrap: balance; }
.who { font-family: var(--f-display); font-weight: 500; font-size: clamp(1.7rem, 6vw, 2.6rem); line-height: 1.1; margin: 6px 0 0; color: var(--gold-hi); text-wrap: balance; overflow-wrap: anywhere; }
.sub { color: var(--muted); margin: 6px 0 0; }
.center { text-align: center; }
.turn { text-align: center; display: flex; flex-direction: column; align-items: center; }
.err { color: var(--bad); margin: 0; font-weight: 500; }

/* Buttons */
.btn { min-height: 50px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--line); background: var(--raised); color: var(--cream); font-weight: 600; font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; transition: transform 0.12s ease, filter 0.12s ease, background 0.2s ease; position: relative; overflow: hidden; }
.btn:hover:not(:disabled) { filter: brightness(1.12); }
.btn:active:not(:disabled) { transform: scale(0.96); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.gold { background: linear-gradient(180deg, #F6E3A8 0%, #D9B45A 55%, #A47A2A 100%); color: var(--on-gold); border-color: transparent; box-shadow: 0 6px 20px rgba(217,180,90,0.25); }
.btn.gold::after { content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255,255,255,0.55), transparent); transform: skewX(-20deg); animation: sheen 3.2s ease-in-out infinite; }
@keyframes sheen { 0%, 60% { left: -60%; } 100% { left: 130%; } }
.btn.big { min-height: 58px; padding: 0 30px; font-size: 1.08rem; }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: 0.9rem; }
.btn.ghost { background: transparent; }
.btn[aria-pressed="true"] { border-color: var(--gold); background: rgba(217,180,90,0.18); color: var(--gold-hi); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.actions.left { justify-content: flex-start; }

/* Entry */
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding-block: 6px 4px; }
.ball { width: 116px; height: 116px; filter: drop-shadow(0 12px 30px rgba(217,180,90,0.35)); animation: bob 4s ease-in-out infinite; }
.ball .glint { animation: twinkle 1.8s ease-in-out infinite; transform-origin: 66px 58px; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
.title { font-family: var(--f-display); font-weight: 500; font-size: clamp(2.5rem, 10vw, 4.4rem); line-height: 1; margin: 6px 0 0; text-wrap: balance;
  background: linear-gradient(110deg, #B8892E 0%, #F6E3A8 35%, #FFF6D6 50%, #D9B45A 65%, #A47A2A 100%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; animation: shimmer 6s linear infinite; }
.title span { display: block; font-family: var(--f-script); font-weight: 400; font-size: 0.6em; line-height: 1.3; }
.meta { color: var(--muted); margin: 6px 0 0; }
.panel { background: rgba(24,21,15,0.92); border: 1px solid var(--line); border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 16px; max-width: 560px; width: 100%; margin-inline: auto; box-sizing: border-box; }
.field { display: flex; flex-direction: column; gap: 8px; }
.inp { width: 100%; box-sizing: border-box; min-height: 54px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--cream); padding: 0 16px; font: 500 1.08rem var(--f-body); }
.inp:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px rgba(217,180,90,0.25); }
.inp::placeholder { color: #8C8270; }
.inp.code { text-transform: uppercase; letter-spacing: 0.4em; font-family: var(--f-display); font-size: 1.5rem; text-align: center; }
.addrow { display: flex; gap: 10px; flex-wrap: wrap; }
.addrow .inp { flex: 1 1 140px; min-width: 0; }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 0.85rem; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.hint { color: var(--muted); margin: 0; font-size: 0.92rem; }
.spinner { width: 54px; height: 54px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--gold); animation: spin 0.9s linear infinite; margin: 10px auto; }

/* Room card */
.roomcard { display: flex; gap: 20px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: linear-gradient(135deg, rgba(217,180,90,0.16), rgba(24,21,15,0.95) 55%); border: 1px solid var(--gold-lo); border-radius: 22px; padding: 20px 22px; }
.rc-text { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 260px; }
.bigcode { font-family: var(--f-display); font-size: clamp(3rem, 14vw, 4.6rem); letter-spacing: 0.18em; line-height: 1; margin: 0; color: var(--gold-hi); }
.linktext { margin: 0; font-size: 0.85rem; color: var(--muted); overflow-wrap: anywhere; }
.qr { background: #FFFDF6; border-radius: 16px; padding: 10px; line-height: 0; flex-shrink: 0; }
.qr svg { width: 150px; height: 150px; display: block; }

/* People */
.people { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 0; }
.person { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 12px; }
.person.me { border-color: var(--gold-lo); }
.person .od { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.person .od.off { background: #6C6252; }
.person .nm { font-weight: 500; padding-right: 6px; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.iconbtn:hover { background: var(--bg); color: var(--cream); }
.iconbtn[aria-pressed="true"] svg path { fill: #D9B45A; }
.waitdots { display: flex; gap: 8px; justify-content: center; margin: 8px 0; }
.waitdots i { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); animation: hop 1.2s ease-in-out infinite; }
.waitdots i:nth-child(2) { animation-delay: 0.15s; } .waitdots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes hop { 0%, 80%, 100% { transform: translateY(0); opacity: 0.5; } 40% { transform: translateY(-10px); opacity: 1; } }

/* Hub tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 14px; margin-top: 10px; }
.tile { position: relative; overflow: hidden; text-align: left; border: 0; border-radius: 18px; padding: 18px 18px 20px; min-height: 150px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; transition: transform 0.18s ease, box-shadow 0.18s ease; box-shadow: 0 8px 22px rgba(0,0,0,0.35); }
.tile:hover { transform: translateY(-4px) rotate(-0.5deg); box-shadow: 0 16px 34px rgba(0,0,0,0.5); }
.tile:active { transform: scale(0.97); }
.tnum { font-family: var(--f-label); font-size: 0.66rem; letter-spacing: 0.24em; font-weight: 600; opacity: 0.9; }
.tname { font-size: 1.65rem; line-height: 1.05; margin-top: auto; text-wrap: balance; }
.ttag { font-size: 0.9rem; line-height: 1.35; }
.resume { position: absolute; top: 14px; right: 14px; background: rgba(0,0,0,0.55); color: #F3DC94; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; padding: 4px 10px; border-radius: 999px; z-index: 1; }
.t-gr { background: #121212; color: #EFE6D2; box-shadow: inset 0 0 0 2px #C9A04A, 0 8px 22px rgba(0,0,0,0.35); } .t-gr .tname { font-family: 'Limelight', serif; color: #E2C276; } .t-gr .ttag { font-family: 'Josefin Sans', sans-serif; }
.t-tod { background: #14213D; color: #F6E4E0; } .t-tod .tname { font-family: 'Playfair Display', serif; font-style: italic; } .t-tod .tnum { color: #E3A999; }
.t-nhie { background: #B4461C; color: #FFF1DC; } .t-nhie .tname { font-family: 'Shrikhand', cursive; } .t-nhie .ttag { font-family: 'Karla', sans-serif; font-weight: 500; }
.t-nhie::after { content: ""; position: absolute; right: -40px; bottom: -40px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, #5B2E1F 0 30%, #E0592A 30% 55%, #F2A93B 55% 80%, transparent 80%); }
.t-mlt { background: #3E2163; color: #EDE6F5; } .t-mlt .tname { font-family: 'Bebas Neue', sans-serif; font-size: 2.1rem; color: #E3C55A; } .t-mlt .ttag { font-family: 'Libre Baskerville', serif; font-style: italic; font-size: 0.86rem; }
.t-wyr { background: #1F6F66; color: #FBF6EE; } .t-wyr::before { content: ""; position: absolute; top: 0; right: 0; width: 46%; height: 100%; background: #F4876B; clip-path: polygon(40% 0, 100% 0, 100% 100%, 85% 100%); } .t-wyr > * { position: relative; } .t-wyr .tname { font-family: 'Fraunces', serif; font-weight: 900; max-width: 72%; } .t-wyr .ttag { max-width: 62%; }
.t-know { background: #9C4C57; color: #FFFFFF; } .t-know .tname { font-family: 'Parisienne', cursive; font-size: 1.95rem; line-height: 1.15; } .t-know .ttag { font-family: 'Lora', serif; }
.t-cha { background: #6E1215; color: #F5E6C8; box-shadow: inset 0 0 0 4px #6E1215, inset 0 0 0 8px #B8892E, 0 8px 22px rgba(0,0,0,0.35); } .t-cha .tname { font-family: 'Abril Fatface', serif; } .t-cha .ttag { font-family: 'Oswald', sans-serif; font-weight: 500; }
.t-dsi { background: #C21D63; color: #FFFFFF; } .t-dsi::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: #141414; } .t-dsi .tname { font-family: 'Archivo Black', sans-serif; text-transform: uppercase; font-size: 1.5rem; } .t-dsi .ttag { font-family: 'Archivo', sans-serif; font-weight: 500; }
.t-two { background: #E8DAB8; color: #1F1F1F; } .t-two .tname { font-family: 'Old Standard TT', serif; font-weight: 700; } .t-two .ttag { font-family: 'Special Elite', monospace; color: #3A3226; } .t-two .tnum { color: #8A2E24; }
.t-who { background: #FBF8F1; color: #23305A; } .t-who::after { content: ""; position: absolute; top: 16px; right: 16px; width: 30px; height: 30px; border-radius: 50%; background: #8C2F39; } .t-who .tname { font-family: 'EB Garamond', serif; font-weight: 600; font-size: 1.85rem; } .t-who .ttag { font-family: 'EB Garamond', serif; font-style: italic; font-size: 1rem; } .t-who .tnum { color: #8C2F39; }

/* Game header */
.gamehead { display: flex; flex-direction: column; gap: 8px; }
.gh-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.gname { margin: 0; font-size: clamp(1.9rem, 7vw, 2.8rem); line-height: 1.05; color: var(--gold-hi); text-wrap: balance; }
.f-gr { font-family: 'Limelight', serif; } .f-tod { font-family: 'Playfair Display', serif; font-style: italic; } .f-nhie { font-family: 'Shrikhand', cursive; } .f-mlt { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; } .f-wyr { font-family: 'Fraunces', serif; font-weight: 900; } .f-know { font-family: 'Parisienne', cursive; font-weight: 400; } .f-cha { font-family: 'Abril Fatface', serif; } .f-dsi { font-family: 'Archivo Black', sans-serif; text-transform: uppercase; } .f-two { font-family: 'Old Standard TT', serif; font-weight: 700; } .f-who { font-family: 'EB Garamond', serif; font-weight: 600; }
.rules { background: rgba(24,21,15,0.92); border: 1px solid var(--line); border-radius: 14px; padding: 0 16px; }

.yourturn { align-self: center; font-family: var(--f-label); font-weight: 700; letter-spacing: 0.3em; font-size: 0.9rem; color: var(--on-gold); background: linear-gradient(180deg, #F6E3A8, #D9B45A); padding: 10px 22px 10px 26px; border-radius: 999px; animation: pulse 1.4s ease-in-out infinite; box-shadow: 0 0 0 0 rgba(243,220,148,0.6); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(243,220,148,0.55); } 70% { box-shadow: 0 0 0 16px rgba(243,220,148,0); } 100% { box-shadow: 0 0 0 0 rgba(243,220,148,0); } }

/* Player grids */
.plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.prow { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 54px; padding: 8px 16px; border-radius: 14px; background: rgba(24,21,15,0.92); border: 1px solid var(--line); cursor: pointer; text-align: left; transition: border-color 0.2s, background 0.2s, transform 0.12s; }

.prow .pn { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.prow .tag { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.9rem; white-space: nowrap; }
.prow[aria-pressed="true"] { border-color: var(--gold); background: rgba(217,180,90,0.18); }
.prow[aria-pressed="true"] .tag { color: var(--gold-hi); }
.prow:disabled { opacity: 0.45; cursor: default; }
.fingers { display: inline-flex; gap: 3px; }
.fingers i { width: 7px; height: 16px; border-radius: 4px; background: var(--gold); display: block; transition: background 0.3s; }
.fingers i.off { background: var(--line); }
.bars { display: flex; flex-direction: column; gap: 10px; max-width: 560px; width: 100%; margin-inline: auto; }
.bar { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; padding: 12px 16px; display: flex; justify-content: space-between; gap: 12px; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: rgba(217,180,90,0.22); transform-origin: left; }
.growin .fill { animation: grow 0.9s cubic-bezier(.2,.8,.2,1); }
.bar.win .fill { background: rgba(217,180,90,0.38); }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.bar > span { position: relative; overflow-wrap: anywhere; min-width: 0; }
.bar b { font-variant-numeric: tabular-nums; color: var(--gold-hi); }
.progress { text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; margin: 0; }

/* Cards */
.card { width: min(100%, 350px); aspect-ratio: 5 / 7; margin-inline: auto; box-sizing: border-box; border-radius: 20px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 30px 26px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,0.55); }

.ck { margin: 0; } .ctext { margin: 0; text-wrap: balance; }

.c-wyr button.half:active { transform: scale(0.98); }
.c-wyr .a { background: #F4876B; color: #2A1A14; } .c-wyr .b { background: #1F6F66; color: #FBF6EE; }

.c-who textarea { width: 100%; box-sizing: border-box; min-height: 180px; resize: vertical; border: 0; border-radius: 8px; padding: 6px 4px; font: italic 500 1.25rem/32px 'EB Garamond', Georgia, serif; color: #23305A; background: repeating-linear-gradient(to bottom, transparent 0 31px, #B9C6DC 31px 32px); }
.c-who textarea:focus { outline: 2px solid #8C2F39; }
.c-who .note { font-family: 'EB Garamond', serif; font-style: italic; font-size: 1.5rem; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }

.guessbox { display: flex; gap: 10px; max-width: 560px; width: 100%; margin-inline: auto; flex-wrap: wrap; }
.guessbox .inp { flex: 1 1 200px; }

/* Teams + timer */
.teams { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.team { background: rgba(24,21,15,0.92); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; transition: border-color 0.3s, box-shadow 0.3s; }
.team.now { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 30px rgba(217,180,90,0.15); }
.team.mine .tn::after { content: " · YOU"; color: var(--cream); }
.team .tn { font-family: var(--f-label); font-weight: 700; letter-spacing: 0.14em; font-size: 0.78rem; color: var(--gold); }
.team .ts { font-family: var(--f-display); font-size: 2.5rem; line-height: 1; font-variant-numeric: tabular-nums; color: var(--gold-hi); }
.team .tm { color: var(--muted); font-size: 0.88rem; overflow-wrap: anywhere; }
.goal { text-align: center; color: var(--muted); margin: 0; font-size: 0.92rem; }
.timer { position: relative; width: 130px; height: 130px; margin-inline: auto; }
.timer svg { width: 130px; height: 130px; transform: rotate(-90deg); }
.timer .trb { fill: none; stroke: var(--line); stroke-width: 8; }
.timer .tr { fill: none; stroke: var(--gold); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 326.7; transition: stroke-dashoffset 0.25s linear; }
.timer span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: 2.8rem; font-variant-numeric: tabular-nums; color: var(--gold-hi); }
.timer.urgent { animation: shake 0.5s ease-in-out infinite; } .timer.urgent .tr { stroke: var(--bad); } .timer.urgent span { color: #F7C2B8; }
@keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }

/* Gold Rush */
.grtable { display: flex; gap: 26px; justify-content: center; align-items: center; flex-wrap: wrap; }
.pile { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.suitpill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; color: var(--sc); }
.hand { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.grc { width: 72px; aspect-ratio: 5 / 7; box-sizing: border-box; border-radius: 10px; background: #FBF7EE; border: 3px solid var(--sc); color: var(--sc); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; cursor: pointer; box-shadow: 0 6px 14px rgba(0,0,0,0.4); transition: transform 0.15s ease, box-shadow 0.15s; }
@keyframes deal { from { transform: translateY(30px) rotate(8deg); opacity: 0; } }
.deal { animation: deal 0.45s ease backwards; }
.fresh .tile, .fresh .srow, .fresh .keep article { animation: enter 0.5s ease backwards; }
.grc .ci { position: absolute; top: 5px; left: 6px; line-height: 0; }
.grc .v { font-family: 'Limelight', serif; font-size: 1.8rem; line-height: 1; display: flex; }
.grc .v svg { width: 32px; height: 32px; }
.grc .lb { font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 0.5rem; letter-spacing: 0.12em; text-transform: uppercase; }
.grc.wild { background: #0B0B0B; border-color: #C9A04A; color: #E2C276; }
.grc .ws { display: grid; grid-template-columns: repeat(2, 14px); gap: 4px; }
.grc.big { width: 132px; border-width: 5px; border-radius: 16px; cursor: default; }
.grc.big .v { font-size: 3.4rem; } .grc.big .v svg { width: 60px; height: 60px; } .grc.big .lb { font-size: 0.72rem; } .grc.big .ci { top: 10px; left: 11px; } .grc.big .ci svg { width: 22px; height: 22px; } .grc.big .ws { grid-template-columns: repeat(2, 26px); gap: 8px; } .grc.big .ws svg { width: 26px; height: 26px; }
.grc.ok { box-shadow: 0 0 0 3px var(--gold-hi), 0 10px 22px rgba(217,180,90,0.35); transform: translateY(-5px); }
.grc.ok:hover { transform: translateY(-10px); }
.grc:disabled { opacity: 0.38; cursor: not-allowed; }
.counts { list-style: none; margin: 0 auto; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 700px; }
.counts li { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.counts li.cur { border-color: var(--gold); color: var(--gold-hi); }
.log { margin: 0 auto; max-width: 620px; text-align: center; background: rgba(24,21,15,0.92); border: 1px solid var(--line); border-radius: 14px; padding: 12px 18px; }
.suits { display: grid; grid-template-columns: repeat(2, minmax(0, 160px)); gap: 12px; justify-content: center; }
.suitbtn { min-height: 64px; border-radius: 16px; border: 2px solid var(--sc); background: var(--surface); color: var(--sc); font-weight: 600; font-size: 1.05rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }

/* Scores */
.slist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-width: 720px; width: 100%; margin-inline: auto; }
.srow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; background: rgba(24,21,15,0.92); border: 1px solid var(--line); border-radius: 16px; padding: 12px 18px; }
.srow.lead { border-color: var(--gold); background: linear-gradient(90deg, rgba(217,180,90,0.18), rgba(24,21,15,0.95) 60%); }
.srow.me .sname::after { content: "you"; font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-left: 4px; }
.rank { font-family: var(--f-display); font-size: 1.4rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.sname { font-weight: 600; font-size: 1.08rem; display: flex; align-items: center; gap: 8px; min-width: 0; overflow-wrap: anywhere; }
.spts { font-family: var(--f-display); font-size: 2rem; color: var(--gold-hi); font-variant-numeric: tabular-nums; grid-row: span 2; }
.schips { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; }
.sc { font-size: 0.76rem; padding: 2px 10px; border-radius: 999px; background: var(--raised); color: var(--muted); font-variant-numeric: tabular-nums; }
.confirm { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; background: var(--surface); border: 1px solid #7A3B32; border-radius: 16px; padding: 14px 18px; max-width: 640px; margin-inline: auto; }

/* Win + keepsake */
.win { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-block: 16px; }
.win svg.crown { width: 90px; height: 90px; filter: drop-shadow(0 8px 24px rgba(217,180,90,0.5)); }
.crownin svg.crown { animation: crownIn 0.9s cubic-bezier(.2,.9,.3,1.4); }
@keyframes crownIn { from { transform: translateY(-40px) rotate(-20deg) scale(0.4); opacity: 0; } }
.keep { display: flex; flex-direction: column; gap: 12px; max-width: 680px; width: 100%; margin-inline: auto; }
.keep article { background: #FBF8F1; color: #23305A; border-radius: 14px; padding: 16px 20px; }
.keep .kp { font-family: 'EB Garamond', serif; font-weight: 600; letter-spacing: 0.18em; font-size: 0.75rem; color: #8C2F39; margin: 0; }
.keep .kt { font-family: 'EB Garamond', serif; font-style: italic; font-size: 1.22rem; margin: 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.keep .kb { font-family: 'Homemade Apple', cursive; font-size: 0.95rem; color: #8C2F39; margin: 0; }
.keeptext { width: 100%; box-sizing: border-box; min-height: 120px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--cream); padding: 12px; font: 0.95rem/1.5 var(--f-body); }

/* Reactions + effects */
.react { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, rgba(14,12,9,0.96) 60%, rgba(14,12,9,0)); overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.react::-webkit-scrollbar { display: none; }
.react .rin { display: flex; gap: 8px; width: max-content; margin-inline: auto; }
.rbtn { min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--gold-hi); font-weight: 600; font-size: 0.92rem; cursor: pointer; transition: transform 0.12s; }
.rbtn:active { transform: scale(0.9); }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.bubble { position: absolute; bottom: 90px; left: var(--x); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; animation: float 3.2s ease-out forwards; }
.bubble b { font-family: var(--f-display); font-size: 1.7rem; color: var(--gold-hi); text-shadow: 0 2px 14px rgba(0,0,0,0.7); white-space: nowrap; }
.bubble small { font-size: 0.75rem; color: var(--cream); background: rgba(0,0,0,0.55); padding: 2px 8px; border-radius: 999px; }
@keyframes float { 0% { transform: translate(-50%, 20px) scale(0.6); opacity: 0; } 15% { transform: translate(-50%, 0) scale(1.1); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), -60vh) scale(0.9); opacity: 0; } }
.confetti i { position: absolute; top: -20px; left: var(--x); width: 8px; height: 14px; background: var(--c); border-radius: 2px; animation: fall var(--d) linear var(--dl) forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
.points { position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%); text-align: center; animation: pts 1.8s cubic-bezier(.2,.9,.3,1.3) forwards; }

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

      }

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

(function () {

  return board + '<div class="turn"><p class="label">Time\'s up</p><p class="who">+' + g.tp + ' for ' + TN[g.team] + '</p>' + (g.stolen ? '<p class="sub">' + TN[o] + ' stole ' + g.stolen + '.</p>' : '') + '</div><div class="actions">' + btnA('dsiNext', g.n, last ? 'See who won' : 'Next up: ' + TN[o], 'gold big') + '</div>';
};
R.two = function () {
  const v = L.V, g = v.g, m = me(), isT = g.teller === m, can = isT || amHost(); const c = TWO[g.card];
  const card = '<article data-ck="two-' + g.n + '" class="card c-two"><span class="file">FILE NO. ' + pad(g.n, 3) + '</span><p class="ck">SUBJECT</p><p class="ctext">' + esc(c[0]) + '</p><p style="margin:0;font-size:1.05rem;line-height:1.45">Two truths and one lie about ' + esc(c[1]) + '.</p><span class="stamp">2 TRUE · 1 LIE</span></article>';
  const head = '<div class="turn"><p class="label">Storyteller</p><p class="who">' + nm(g.teller) + '</p></div>';
  if (g.phase === 'tell') return (isT ? '<div class="yourturn">Your case file</div>' : '') + head + card + '<p class="sub center">' + (isT ? 'Tell three short stories out loud. Remember which one is the lie!' : 'Listen closely to all three stories.') + '</p>' + (can ? '<div class="actions">' + btnA('twoOpen', null, 'Done telling. Open the vote', 'gold big') + '</div>' : '');
  if (g.phase === 'vote') {
    if (isT) return head + '<p class="sub center">' + g.nVoted + ' of ' + g.nOn + ' have voted. When you\'re ready, reveal the lie.</p><div class="actions">' + [0, 1, 2].map(function (i) { return btnA('twoLie', i, 'Story ' + (i + 1) + ' was the lie', 'big'); }).join('') + '</div>';
    return head + '<p class="sub center">Which story was the lie?</p><div class="actions">' + [0, 1, 2].map(function (i) { return btnA('twoVote', i, 'Story ' + (i + 1), g.myVote === i ? 'gold big' : 'big', ' aria-pressed="' + (g.myVote === i) + '"'); }).join('') + '</div><p class="progress">' + g.nVoted + ' of ' + g.nOn + ' voted</p>' + (amHost() ? '<div class="actions">' + [0, 1, 2].map(function (i) { return btnA('twoLie', i, 'Host: story ' + (i + 1) + ' was the lie', 'ghost sm'); }).join('') + '</div>' : '');
  }
  const tot = Math.max(1, g.counts[0] + g.counts[1] + g.counts[2]);
  return head + '<div class="turn"><p class="label">The lie was</p><p class="who">Story ' + (g.lie + 1) + '</p><p class="sub">' + (g.right.length ? 'Spotted by ' + g.right.map(nm).join(', ') + ' · +1 each' : 'Nobody spotted it! ' + nm(g.teller) + ' earns 2.') + '</p></div>' +
    '<div class="bars" data-ck="twob-' + g.n + '" data-ac="growin">' + [0, 1, 2].map(function (i) { return '<div class="bar' + (i === g.lie ? ' win' : '') + '"><span class="fill" style="width:' + Math.round(g.counts[i] / tot * 100) + '%"></span><span>Story ' + (i + 1) + (i === g.lie ? ' · the lie' : '') + '</span><b>' + g.counts[i] + '</b></div>'; }).join('') + '</div>' +
    '<div class="actions">' + btnA('twoNext', g.n, 'Next storyteller', 'gold big') + '</div>';
};
R.who = function () {
  const v = L.V, g = v.g, m = me(), judge = g.judge === m || amHost(), isB = isMeBday(); const her = herName();
  if (g.phase === 'write') {
    let mid;
    if (isB) mid = '<div class="turn"><p class="who">Your guests are writing to you</p><p class="sub">No peeking at their screens!</p><div class="waitdots" aria-hidden="true"><i></i><i></i><i></i></div></div>';
    else if (g.sealed) mid = '<div class="turn"><p class="who">Your note is sealed</p><p class="sub">' + her + ' will read it soon.</p></div>';
    else { const p = WHO[g.myPrompt]; mid = '<form id="whoForm" class="stage" style="gap:14px" autocomplete="off"><article data-ck="who-p-' + g.myPrompt + '" class="card free c-who"><p class="ck">' + p[0] + '</p><label for="whoIn" class="cprompt">' + esc(p[1]) + '</label><textarea id="whoIn" maxlength="400" placeholder="Write here. Don\'t sign it."></textarea></article><div class="actions"><button class="btn gold big" type="submit">Seal my note</button>' + btnA('whoReroll', null, 'Different prompt', 'ghost', ' type="button"') + '</div></form>'; }
    return mid + '<p class="progress">' + g.n + ' of ' + g.writers + ' notes sealed</p>' + (judge ? '<div class="actions">' + btnA('whoReveal', null, 'Start the reveal', 'gold big', g.n ? '' : ' disabled') + '</div>' : '');
  }
  if (g.phase === 'reveal') {
    const n = g.note; const p = WHO[n.p];
    const card = '<article data-ck="who-r-' + g.ri + '" class="card free c-who"><p class="ck">NOTE ' + (g.ri + 1) + ' OF ' + g.n + ' · ' + p[0] + '</p><p class="cprompt">' + esc(p[1]) + '</p><p class="note">' + esc(n.t) + '</p>' + (n.by ? '<p class="sig">' + nm(n.by) + '</p>' : '') + '</article>';
    if (!g.guess) {
      if (judge) { const authors = g.authors.filter(function (x, i, a) { return a.indexOf(x) === i; }); return card + '<p class="sub center">' + (isB ? 'Read it out loud. Who wrote it?' : her + ' guesses who wrote it.') + '</p><div class="plist">' + authors.map(function (id) { return '<button class="prow" data-act="a" data-a="whoGuess" data-x="' + id + '"><span class="pn">' + nm(id) + '</span><span class="tag">Guess</span></button>'; }).join('') + '</div>'; }
      return card + '<p class="sub center">' + her + ' is guessing who wrote this…</p>';
    }
    const right = g.guess === n.by;
    return card + '<div class="turn"><p class="who">' + (right ? 'She knew it!' : 'Not quite') + '</p><p class="sub">Written by ' + nm(n.by) + (right ? '' : '. ' + her + ' guessed ' + nm(g.guess) + '.') + '</p></div>' + (judge ? '<div class="actions">' + btnA('whoNext', null, g.ri + 1 < g.n ? 'Next note' : 'See all the notes', 'gold big') + '</div>' : '');
  }
  const keep = g.keep || [];
  const plain = keep.map(function (k) { const q = P(k.by); return WHO[k.p][1] + ' ' + k.t + '\n— ' + (q ? q.name : 'Someone'); }).join('\n\n');
  return '<div class="turn"><p class="label">Keepsake</p><p class="who">Every note for ' + her + '</p></div><div class="keep">' + keep.map(function (k, i) { return '<article style="animation-delay:' + (i * 0.05).toFixed(2) + 's"><p class="kp">' + WHO[k.p][0] + '</p><p class="kt">' + esc(WHO[k.p][1] + ' ' + k.t) + '</p><p class="kb">' + nm(k.by) + '</p></article>'; }).join('') + '</div>' +
    '<label for="keepText" class="sr">All notes as text</label><textarea id="keepText" class="keeptext" readonly data-fresh="1">' + esc(plain) + '</textarea><div class="actions"><button class="btn gold" data-act="copyKeep">Copy all notes</button>' + (amHost() ? btnA('restart', 'who', 'Start a new round', 'ghost') : '') + '</div>';
};

/* =========================================================
   INPUT
   ========================================================= */
const LOCAL = {
  tab: function (x) { L.tab = x === 'scores' ? 'scores' : 'play'; L.confirmLeave = false; L.confirmReset = false; render(); },
  host: function () {
    const n = (document.getElementById('nameIn') || {}).value || ''; const name = n.trim().replace(/\s+/g, ' ').slice(0, 20);
    if (!name) { L.err = 'Type your name first.'; render(); const el = document.getElementById('nameIn'); if (el) el.focus(); return; }
    L.me.name = name; lsSet('rr22-me', L.me); L.err = '';
    const rn = ((document.getElementById('roomIn') || {}).value || '').trim().replace(/\s+/g, ' ').slice(0, 24); const code = newCode(); H = freshH(code, rn); wake(); startHost(code, false);
  },
  react: function (x) { const now = Date.now(); if (now - (LOCAL._r || 0) < 700) return; LOCAL._r = now; send('react', { x: x }); },
  leave: function () { leave(false); },
  askLeave: function () { L.confirmLeave = true; render(); },
  cancelLeave: function () { L.confirmLeave = false; render(); },
  askReset: function () { L.confirmReset = true; render(); },
  cancelReset: function () { L.confirmReset = false; render(); },
  reload: function () { location.reload(); },
  copyLink: function () { const t = document.getElementById('linkText'); if (t) copyText(t.textContent, t); },
  copyKeep: function () { const t = document.getElementById('keepText'); if (t) copyText(t.value, t); }
};
function copyText(txt, el) {
  const fb = function () { try { const r = document.createRange(); r.selectNodeContents(el); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); if (el.select) el.select(); } catch (e) {} toast('Selected. Use Copy from your keyboard menu.'); };
  try { navigator.clipboard.writeText(txt).then(function () { toast('Copied'); }, fb); } catch (e) { fb(); }
}
document.addEventListener('click', function (e) {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  ensureAudio();
  const act = b.dataset.act;
  if (act === 'a') { e.preventDefault(); const a = b.dataset.a; if (a === 'resetScores') L.confirmReset = false; send(a, { x: b.dataset.x }); return; }
  if (LOCAL[act]) { e.preventDefault(); LOCAL[act](b.dataset.x); }
});
document.addEventListener('submit', function (e) {
  e.preventDefault(); ensureAudio();
  const f = e.target;
  if (f.id === 'joinForm' && document.activeElement && document.activeElement.id === 'roomIn') { LOCAL.host(); return; }
  if (f.id === 'joinForm') {
    const name = (document.getElementById('nameIn').value || '').trim().replace(/\s+/g, ' ').slice(0, 20);
    const code = (document.getElementById('codeIn').value || '').trim().toUpperCase().replace(/[^A-Z]/g, '');
    if (!name) { L.err = 'Type your name first.'; render(); document.getElementById('nameIn').focus(); return; }
    if (code.length !== 4) { L.err = 'Room codes have 4 letters. Ask someone in the room to show it.'; render(); document.getElementById('codeIn').focus(); return; }
    L.me.name = name; lsSet('rr22-me', L.me); L.err = ''; L.code = code; L.prefill = code; L.V = null; L.status = 'connecting';
    lsSet('rr22-session', { role: 'guest', code: code });
    try { if (peer) peer.destroy(); } catch (x) {} peer = null;
    connectGuest(true);
  } else if (f.id === 'renameForm') {
    const nn = (document.getElementById('renameIn').value || '').trim().replace(/\s+/g, ' ').slice(0, 20); if (!nn) return;
    L.me.name = nn; lsSet('rr22-me', L.me);
    if (L.role === 'host' && H) { const hp = pl(L.me.pid); if (hp) hp.name = nn; schedule(); }
    else if (conn && conn.open) { try { conn.send({ t: 'hello', pid: L.me.pid, name: nn }); } catch (x) {} }
    toast('Name saved');
  } else if (f.id === 'knowForm') {
    const el = document.getElementById('knowIn'); const t = (el.value || '').trim(); if (!t) { el.focus(); return; }
    L.clear = 'knowIn'; send('knowGuess', { x: t }); el.value = ''; el.blur();
  } else if (f.id === 'whoForm') {
    const el = document.getElementById('whoIn'); const t = (el.value || '').trim(); if (!t) { toast('Write something before sealing your note.'); el.focus(); return; }
    L.clear = 'whoIn'; send('whoSeal', { x: t }); el.blur(); toast('Note sealed');
  }
});
document.addEventListener('input', function (e) { if (e.target.id === 'codeIn') { const v = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4); if (v !== e.target.value) e.target.value = v; } });

/* =========================================================
   BOOT
   ========================================================= */
function boot() {
  const s = lsGet('rr22-session');
  if (s && L.me.name && (!L.prefill || L.prefill === s.code)) {
    if (s.role === 'host') { const saved = lsGet('rr22-host'); H = saved && saved.code === s.code ? saved : freshH(s.code); H.hostPid = L.me.pid; const hp = pl(L.me.pid); if (hp) { hp.online = true; hp.name = L.me.name; } else H.players.unshift({ pid: L.me.pid, name: L.me.name, bday: false, online: true }); H.players.forEach(function (p) { if (p.pid !== L.me.pid) p.online = false; }); startHost(s.code, true); return; }
    if (s.role === 'guest') { L.code = s.code; L.role = 'guest'; connectGuest(); return; }
  }
  render();
}
const t0 = Date.now();
function hideSplash() { const sp = document.getElementById('splash'); if (!sp) return; sp.classList.add('out'); setTimeout(function () { sp.remove(); }, 800); }
boot();
window.addEventListener('load', function () { setTimeout(hideSplash, Math.max(0, 2700 - (Date.now() - t0))); });
setTimeout(hideSplash, 5000);
window.__rr = { flush: flush, viewFor: viewFor, TIMEUP: TIMEUP, receiveView: receiveView, LOCAL: LOCAL, L: L, getH: function () { return H; }, hostAct: hostAct, ACT: ACT, freshH: function (c) { H = freshH(c); return H; }, fake: function (name) { const pid = 'f' + rid(6); H.players.push({ pid: pid, name: name, bday: false, online: true }); schedule(); return pid; }, setRole: function (r) { L.role = r; L.status = 'ok'; }, render: render };
})();
